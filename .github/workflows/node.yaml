name: "Node js CI"

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Nodejs
        uses: actions/setup-node@v7
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
        with:
          node-version: "26.x"
      - name: Install dependencies
        run: yarn --frozen-lockfile

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
